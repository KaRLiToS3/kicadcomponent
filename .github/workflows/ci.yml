# Comprueba en cada push que el paquete se construye e instala en todas las
# versiones de Python que declara soportar (requires-python = ">=3.9").

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: uv pip install --system .

      - name: Arrancar
        run: |
          kicadcomponent --version
          kicadcomponent --help
