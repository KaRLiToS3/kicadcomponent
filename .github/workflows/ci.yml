# Comprueba en cada push que el paquete se construye e instala en todas las
# versiones de Python que declara soportar (requires-python = ">=3.9").

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}

      # En un venv y no con --system: setup-uv instala un Python gestionado por
      # uv, que no es el del sistema, y en macOS el de Homebrew esta ademas
      # marcado como externally managed.
      - name: Instalar
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install . pytest

      - name: Tests
        run: uv run --no-sync pytest

      - name: Arrancar
        run: |
          uv run --no-sync kicadcomponent --version
          uv run --no-sync kicadcomponent --help
