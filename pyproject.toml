[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicadcomponent"
version = "0.1.0"
description = "Import and remove LCSC/EasyEDA components in a KiCad project, keeping symbol, footprint and 3D model in sync"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos", email = "capelosmor@gmail.com" }]
keywords = ["kicad", "easyeda", "lcsc", "jlcpcb", "electronics", "pcb"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["easyeda2kicad>=1.0.1"]

[project.urls]
Homepage = "https://github.com/KaRLiToS3/kicadcomponent"
Repository = "https://github.com/KaRLiToS3/kicadcomponent"
Issues = "https://github.com/KaRLiToS3/kicadcomponent/issues"

[project.scripts]
kicadcomponent = "kicadcomponent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kicadcomponent"]
